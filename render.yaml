services:
  - type: web
    name: finpilot
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: "none"
      - key: FRONTEND_DIST_DIR
        value: "/app/frontend/dist"
      - key: DATABASE_URL
        value: "sqlite:///./data/finpilot.db"
      - key: CORS_ORIGINS
        value: '["*"]'
